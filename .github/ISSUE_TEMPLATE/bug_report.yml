name: Bug report
description: Something behaves incorrectly
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A reproducible bug is a fixed bug.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual behavior, with numbers where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a run
        2. Turn the screen off for 2 minutes
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - Both mobile platforms
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: v0.5.0 (a1b2c3d)
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Light, Dark, System]
  - type: dropdown
    id: locale
    attributes:
      label: Language
      options: [English, العربية]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste errors from `flutter run` or attach screenshots.
      render: shell
