name: Feature request
description: Propose a capability or an improvement
labels: ["feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing or annoying today? Describe the user, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else could solve this, and why is it worse?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not cover.
  - type: dropdown
    id: milestone
    attributes:
      label: Target milestone
      options:
        - v0.1-foundation
        - v0.2-design-system
        - v0.3-data-layer
        - v0.4-gps-core
        - v0.5-live-run
        - v0.6-history
        - v0.7-insight
        - v1.0-launch
        - v2 backlog
    validations:
      required: true
