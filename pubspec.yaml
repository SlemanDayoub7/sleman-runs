name: sleman_runs
description: "Offline-first running app built in public."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.11.0

# Only what the current milestone imports. Feature dependencies are added with
# the feature that needs them (drift in Week 3, geolocator in Week 4), which
# keeps the lockfile honest and lets dependency_validator fail on dead weight.
dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  fpdart: ^1.2.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  bloc_test: ^10.0.0
  dependency_validator: ^5.1.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true

  # The OFL texts travel with the font binaries, so a release APK carries the
  # licence it is required to reproduce.
  assets:
    - assets/fonts/Manrope/OFL.txt
    - assets/fonts/JetBrains_Mono/OFL.txt
    - assets/fonts/IBM_Plex_Sans_Arabic/OFL.txt

  # Fonts are bundled with their OFL licences so the app works offline from
  # the first launch. No google_fonts and no runtime network fetch.
  fonts:
    - family: Manrope
      fonts:
        - asset: 'assets/fonts/Manrope/Manrope[wght].ttf'
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: 'assets/fonts/JetBrains_Mono/JetBrainsMono[wght].ttf'
