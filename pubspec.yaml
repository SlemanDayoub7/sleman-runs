name: sleman_runs
description: "Offline-first running app built in public."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

# Only what the current milestone imports. Feature dependencies are added with
# the feature that needs them (drift in Week 3, geolocator in Week 4), which
# keeps the lockfile honest and lets dependency_validator fail on dead weight.
dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  fpdart: ^1.2.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.6

dev_dependencies:
  bloc_test: ^10.0.0
  dependency_validator: ^5.1.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true

  # Fonts are bundled in Week 2 with their OFL licences. Until then the
  # platform font is used, with tabular figures for metrics.
